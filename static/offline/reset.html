<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3f4247">
  <title>Agres | Atualizando coleta offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #e7e9ec;
      color: #272a2f;
      font-family: Arial, Helvetica, sans-serif;
    }
    .box {
      max-width: 520px;
      width: 100%;
      padding: 22px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #d3d6da;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.10);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 8px 0; line-height: 1.45; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      padding: 0 14px;
      border-radius: 8px;
      background: #3f4247;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>Atualizando coleta offline</h1>
    <p id="status">Limpando cache antigo da tela offline...</p>
    <p>Se não abrir automaticamente, toque no botão abaixo.</p>
    <a id="openLink" href="./index.html?v=34">Abrir coleta offline</a>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith("agres-offline-")).map((key) => caches.delete(key)));
        }
        status.textContent = "Cache atualizado. Abrindo a coleta offline...";
      } catch (error) {
        status.textContent = "Cache não pôde ser limpo automaticamente, mas você pode abrir a coleta.";
      }
      window.setTimeout(() => {
        window.location.replace("./index.html?v=34");
      }, 600);
    })();
  </script>
</body>
</html>
